name: Go Core

on:
  push:
    branches: [main, "impl/**"]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...
      - run: go test -race ./internal/modproc ./internal/protocol ./internal/project ./internal/modpkg ./internal/resource
